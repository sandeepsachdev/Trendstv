<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendsTV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Display:wght@400;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- Loading screen -->
<div class="loading-screen" id="loadingScreen">
    <div class="loading-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M3 17L9 11L13 15L21 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 7H21V11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        TrendsTV
    </div>
    <div class="loading-bar"><div class="loading-bar-fill" id="loadingBarFill"></div></div>
    <p class="loading-label">Fetching latest news…</p>
</div>

<!-- Error screen -->
<div class="error-screen hidden" id="errorScreen">
    <div class="error-inner">
        <div class="error-icon">⚡</div>
        <h2>Couldn't load news</h2>
        <p>Check your connection and try again.</p>
        <button onclick="window.tv.load(true)">Retry</button>
    </div>
</div>

<!-- Main TV view -->
<div class="tv" id="tv" style="display:none">

    <!-- Top bar -->
    <header class="topbar">
        <div class="topbar-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M3 17L9 11L13 15L21 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17 7H21V11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            TrendsTV
        </div>

        <div class="topbar-controls">
            <!-- Layout picker -->
            <div class="layout-picker" id="layoutPicker">
                <button class="layout-btn active" data-layout="1" title="1 item — fullscreen">
                    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="2" fill="currentColor"/></svg>
                </button>
                <button class="layout-btn" data-layout="4" title="4 items — 2×2">
                    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor"/></svg>
                </button>
                <button class="layout-btn" data-layout="9" title="9 items — 3×3">
                    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="4" height="4" rx="1" fill="currentColor"/><rect x="6" y="1" width="4" height="4" rx="1" fill="currentColor"/><rect x="11" y="1" width="4" height="4" rx="1" fill="currentColor"/><rect x="1" y="6" width="4" height="4" rx="1" fill="currentColor"/><rect x="6" y="6" width="4" height="4" rx="1" fill="currentColor"/><rect x="11" y="6" width="4" height="4" rx="1" fill="currentColor"/><rect x="1" y="11" width="4" height="4" rx="1" fill="currentColor"/><rect x="6" y="11" width="4" height="4" rx="1" fill="currentColor"/><rect x="11" y="11" width="4" height="4" rx="1" fill="currentColor"/></svg>
                </button>
                <button class="layout-btn" data-layout="16" title="16 items — 4×4">
                    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="5" y="1" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="9" y="1" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="13" y="1" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="1" y="5" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="5" y="5" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="9" y="5" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="13" y="5" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="1" y="9" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="5" y="9" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="9" y="9" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="13" y="9" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="1" y="13" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="5" y="13" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="9" y="13" width="3" height="3" rx="0.8" fill="currentColor"/><rect x="13" y="13" width="3" height="3" rx="0.8" fill="currentColor"/></svg>
                </button>
                <button class="layout-btn" data-layout="25" title="25 items — 5×5">
                    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="4.5" y="1" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="8" y="1" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="11.5" y="1" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="15" y="1" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="1" y="4.5" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="4.5" y="4.5" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="8" y="4.5" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="11.5" y="4.5" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="15" y="4.5" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="1" y="8" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="4.5" y="8" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="8" y="8" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="11.5" y="8" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="15" y="8" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="1" y="11.5" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="4.5" y="11.5" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="8" y="11.5" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="11.5" y="11.5" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="15" y="11.5" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="1" y="15" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="4.5" y="15" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="8" y="15" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="11.5" y="15" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="15" y="15" width="2" height="2" rx="0.5" fill="currentColor"/></svg>
                </button>
            </div>

            <!-- Filters toggle -->
            <button class="filter-toggle" id="filterToggle">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                    <line x1="4" y1="6" x2="20" y2="6" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    <line x1="8" y1="12" x2="16" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    <line x1="11" y1="18" x2="13" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Filters
            </button>
        </div>
    </header>

    <!-- Filter panel — source chips are injected by JS -->
    <div class="filter-panel hidden" id="filterPanel">
        <div class="filter-row" id="regionFilterRow">
            <span class="filter-row-label">Region</span>
            <div class="chips" id="regionFilters">
                <button class="chip active" data-region="">All regions</button>
                <button class="chip" data-region="Australia">Australia</button>
                <button class="chip" data-region="UK">UK</button>
                <button class="chip" data-region="USA">USA</button>
                <button class="chip" data-region="Global">Global</button>
            </div>
        </div>
        <div class="filter-row">
            <span class="filter-row-label">Source</span>
            <div class="chips" id="sourceFilters">
                <button class="chip active" data-source="">All sources</button>
                <!-- Populated dynamically by app.js once data loads -->
            </div>
        </div>
        <div class="filter-row">
            <span class="filter-row-label">Category</span>
            <div class="chips" id="categoryFilters">
                <button class="chip active" data-category="">All</button>
                <button class="chip" data-category="Australia">Australia</button>
                <button class="chip" data-category="World">World</button>
                <button class="chip" data-category="Politics">Politics</button>
                <button class="chip" data-category="Business">Business</button>
                <button class="chip" data-category="Technology">Technology</button>
                <button class="chip" data-category="Science">Science</button>
                <button class="chip" data-category="Sports">Sports</button>
                <button class="chip" data-category="Entertainment">Entertainment</button>
                <button class="chip" data-category="News">News</button>
            </div>
        </div>
    </div>

    <!-- ── MODE 1: Single fullscreen ── -->
    <div class="mode-single" id="modeSingle">
        <div class="slide-layer" id="slideA"></div>
        <div class="slide-layer" id="slideB"></div>

        <button class="nav-btn nav-prev" id="navPrev">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><polyline points="15 18 9 12 15 6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="nav-btn nav-next" id="navNext">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <a class="slide-overlay" id="slideOverlay" href="#" target="_blank" rel="noopener noreferrer">
            <div class="overlay-top">
                <span class="slide-source" id="slideSource"></span>
                <span class="slide-region" id="slideRegion"></span>
                <span class="slide-category" id="slideCategory"></span>
            </div>
            <div class="overlay-bottom">
                <div class="slide-rank" id="slideRank">#1</div>
                <h1 class="slide-title" id="slideTitle"></h1>
                <p class="slide-desc" id="slideDesc"></p>
                <div class="slide-meta">
                    <span id="slideAge"></span>
                </div>
            </div>
        </a>

        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="queue" id="queue"></div>
        <div class="pause-indicator hidden" id="pauseIndicator">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
            Paused
        </div>
    </div>

    <!-- ── MODE 2: Grid ── -->
    <div class="mode-grid hidden" id="modeGrid">
        <div class="grid-cells" id="gridCells"></div>
    </div>

</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
