<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendsTV — What's Trending Now</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div id="app">
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 17L9 11L13 15L21 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M17 7H21V11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="logo-text">TrendsTV</span>
            </div>
            <div class="header-right">
                <span class="last-updated" id="lastUpdated">Loading...</span>
                <button class="refresh-btn" id="refreshBtn" title="Refresh trends">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 4v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="filter-inner">
            <div class="filter-group">
                <span class="filter-label">Source</span>
                <div class="filter-chips" id="sourceFilters">
                    <button class="chip active" data-source="">All</button>
                    <button class="chip" data-source="Reddit">
                        <svg class="chip-icon reddit-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FF4500"/><circle cx="8.5" cy="13" r="1.2" fill="white"/><circle cx="15.5" cy="13" r="1.2" fill="white"/><path d="M9 16s1 1.5 3 1.5 3-1.5 3-1.5" stroke="white" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="18.5" cy="7" r="1.5" fill="#FF4500"/><path d="M14 8.5c.5-1.5 2.5-2 4-1" stroke="#FF4500" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="18" cy="6.5" r="2.5" fill="#FF4500" stroke="white" stroke-width="1"/></svg>
                        Reddit
                    </button>
                    <button class="chip" data-source="Hacker News">
                        <span class="hn-icon">Y</span>
                        Hacker News
                    </button>
                    <button class="chip" data-source="GitHub">
                        <svg class="chip-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
                        GitHub
                    </button>
                    <button class="chip" data-source="Product Hunt">
                        <svg class="chip-icon" viewBox="0 0 24 24" fill="#DA552F"><path d="M13.604 8.4h-3.405V12h3.405c.995 0 1.801-.806 1.801-1.8 0-.995-.806-1.8-1.801-1.8zM12 0C5.372 0 0 5.372 0 12s5.372 12 12 12 12-5.372 12-12S18.628 0 12 0zm1.604 14.4H10.2v3.6H7.8V6h5.804c2.319 0 4.2 1.881 4.2 4.2 0 2.319-1.881 4.2-4.2 4.2z"/></svg>
                        Product Hunt
                    </button>
                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">Category</span>
                <div class="filter-chips" id="categoryFilters">
                    <button class="chip active" data-category="">All</button>
                    <button class="chip" data-category="Technology">Technology</button>
                    <button class="chip" data-category="News">News</button>
                    <button class="chip" data-category="Science">Science</button>
                    <button class="chip" data-category="Gaming">Gaming</button>
                    <button class="chip" data-category="Entertainment">Entertainment</button>
                    <button class="chip" data-category="Sports">Sports</button>
                    <button class="chip" data-category="Business">Business</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main">
        <!-- Source Stats Bar -->
        <div class="stats-bar" id="statsBar"></div>

        <!-- Loading Spinner -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner">
                <div class="spinner-ring"></div>
                <p class="loading-text">Fetching trends...</p>
            </div>
        </div>

        <!-- Error State -->
        <div class="error-state hidden" id="errorState">
            <div class="error-icon">⚡</div>
            <h3>Couldn't load trends</h3>
            <p>Check your connection and try again</p>
            <button class="btn-primary" onclick="loadTrends()">Retry</button>
        </div>

        <!-- TV Grid -->
        <div class="tv-grid" id="trendsGrid"></div>

        <!-- Load More -->
        <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
            <button class="btn-load-more" id="loadMoreBtn">Load more trends</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>TrendsTV aggregates public trending content from Reddit, Hacker News, GitHub, and Product Hunt.</p>
        <p>Data refreshes every 10 minutes.</p>
    </footer>
</div>

<!-- Card Template -->
<template id="cardTemplate">
    <article class="trend-card">
        <a class="card-link" href="#" target="_blank" rel="noopener noreferrer">
            <div class="card-media">
                <img class="card-image" src="" alt="" loading="lazy">
                <div class="card-image-placeholder">
                    <span class="placeholder-icon"></span>
                </div>
                <div class="card-source-badge">
                    <span class="source-dot"></span>
                    <span class="source-name"></span>
                </div>
                <div class="card-rank">#<span class="rank-num"></span></div>
            </div>
            <div class="card-body">
                <div class="card-category"></div>
                <h3 class="card-title"></h3>
                <p class="card-desc"></p>
                <div class="card-meta">
                    <span class="card-score">
                        <svg class="meta-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span class="score-val"></span>
                    </span>
                    <span class="card-comments">
                        <svg class="meta-icon" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span class="comments-val"></span>
                    </span>
                </div>
            </div>
        </a>
    </article>
</template>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
